# Checks every pull request and every push to main. Overview: CONTRIBUTING.md, "Continuous integration".
#
# Actions are pinned to full commit SHAs with the version in a comment, because a tag can be moved
# to other code. Dependabot updates the SHAs (.github/dependabot.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The token gets no permissions unless a job asks for them.
permissions: {}

# A new push to the same pull request cancels the run that is still going. Runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          # Same uv as on the development machine; Dependabot does not update this input.
          version: "0.13.9"
          require-checksums: true
          # There are no Python dependencies to cache yet; pre-commit has its own cache below.
          enable-cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}

      # The same hooks and versions as `pre-commit run --all-files` on a developer machine.
      - name: Run pre-commit on all files
        run: uvx --python "$(cat .python-version)" pre-commit@4.7.0 run --all-files --show-diff-on-failure --color=always

  gitleaks-history:
    # The pre-commit hook sees only staged changes. This scans every commit, including the
    # commits of the pull request, which GitHub keeps after a squash merge.
    name: gitleaks (history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Keep the version in step with the gitleaks hook in .pre-commit-config.yaml.
      # Checksum of gitleaks_<version>_linux_x64.tar.gz from gitleaks_<version>_checksums.txt of the release.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/gitleaks"
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan the whole history
        run: gitleaks git --redact --no-banner --verbose .

  ci:
    # The only required check in the main ruleset. It always runs and fails if any job above
    # did not succeed, so new jobs (also ones skipped by path filters) need no ruleset change:
    # add them to `needs`.
    name: ci
    if: always()
    needs: [pre-commit, gitleaks-history]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the results of all jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # A skipped job passes (it may be skipped by a path filter); failure or cancellation does not.
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
